# Configuración para ambiente de TESTING (pruebas unitarias)
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: test-jwt-secret-key-minimo-32-caracteres-for-testing
  expiration: 86400000

logging:
  level:
    org.springframework: WARN
    com.motorpoint: DEBUG
