spring:
  application:
    name: motorpoint-backend

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@test.com
    password: test-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: test-jwt-secret-key-minimo-32-caracteres-test
  expiration: 86400000

logging:
  level:
    org.springframework: INFO
    com.motorpoint: DEBUG

paypal:
  client-id: test-client-id
  client-secret: test-client-secret
  mode: sandbox
