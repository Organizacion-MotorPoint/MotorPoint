name: CI - MotorPoint

on:
  push:
    branches: [main, dev, ci/workflows]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # FRONTEND
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
        run: npm run build

      # BACKEND (Java con Maven)
      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build backend
        working-directory: backend
        run: ./mvnw clean install

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw test
