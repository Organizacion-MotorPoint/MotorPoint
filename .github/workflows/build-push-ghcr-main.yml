name: Build & Publish (Production)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "IMAGE_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_CD }}
          # Si TOKEN_CD da error, usar un PAT (GHCR_PAT)

      # ============================
      # BACKEND (Spring Boot)
      # ============================
      - name: Build & push backend (prod)
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_OWNER }}/motorpoint-backend:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_OWNER }}/motorpoint-backend:prod
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_OWNER }}/motorpoint-backend:${{ github.sha }}

      # ============================
      # FRONTEND (React)
      # ============================
      - name: Build & push frontend (prod)
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_OWNER }}/motorpoint-frontend:latest
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_OWNER }}/motorpoint-frontend:prod
            ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_OWNER }}/motorpoint-frontend:${{ github.sha }}

      # ============================
      # AUTOMATIC REDEPLOY (Optional)
      # ============================
      # Solo si quieres redeploy automático en Railway PROD.
      # Para habilitarlo:
      # 1. Crea el secret RAILWAY_PROD_TOKEN
      # 2. Reemplaza SERVICE_ID con el del backend y frontend
      #
      # - name: Install Railway CLI
      #   run: curl -sSL https://raw.githubusercontent.com/railwayapp/cli/master/install.sh | sh

      # - name: Redeploy Backend PROD
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROD_TOKEN }}
      #   run: railway redeploy --service <BACKEND_SERVICE_ID>

      # - name: Redeploy Frontend PROD
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROD_TOKEN }}
      #   run: railway redeploy --service <FRONTEND_SERVICE_ID>
